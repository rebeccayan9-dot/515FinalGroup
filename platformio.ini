; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
build_flags = -mtext-section-literals -mauto-litpools
build_src_filter = +<*> -<haptic_test.cpp> -<i2c_scan.cpp> -<sensor_check.cpp>
monitor_speed = 115200
lib_deps =
    pololu/VL53L1X @ ^1.3.1
    electroniccats/MPU6050 @ ^1.3.0
    adafruit/Adafruit DRV2605 Library @ ^1.2.2

; Standalone haptic bring-up test (each motor fired individually).
; Upload:  pio run -e haptic_test --target upload
[env:haptic_test]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
build_flags = -mtext-section-literals
build_src_filter = +<haptic_test.cpp>
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit DRV2605 Library @ ^1.2.2

; I2C bus scanner (diagnose missing mux / haptics).
; Upload:  pio run -e i2c_scan --target upload
[env:i2c_scan]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
build_flags = -mtext-section-literals
build_src_filter = +<i2c_scan.cpp>
monitor_speed = 115200

; Sensor connection self-check (LiDAR drop-rate under motion + ultrasonics).
; Upload:  pio run -e sensor_check --target upload
[env:sensor_check]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
build_flags = -mtext-section-literals
build_src_filter = +<sensor_check.cpp>
monitor_speed = 115200
lib_deps =
    pololu/VL53L1X @ ^1.3.1
    electroniccats/MPU6050 @ ^1.3.0